<style>
    * {
  width: 100%; height: 100%;
  position: fixed;
  top: 0; left: 0;
  background:black;
}
</style>
<body>
<canvas id = "C"></canvas>

<script>
class B {
  constructor(r = 0.5) {
    C.width  = C.W = ~~(innerWidth * r);
  C.height = C.H = ~~(innerHeight * r);
    this.r = r;
      this.C = C;
      this.context = C.getContext('2d');
      
      this.r = r;
  }
}
class P {
  constructor(x, y) {
    this.x = x;
    this.y = y;
  }
}
const f = 400;
let T =(t, p1, p2, p3, c) => {
  const x = t.context,
        g = x.createRadialGradient(L.x, L.y, 0, L.x, L.y, f);

  for (let i = 0; i <= 10; i++) {
    const u = i / 10, b = (1 - u * u) ** 2;
    g.addColorStop(u, `rgb(${c.r * b},${c.g * b},${c.b * b})`);
  }

  x.fillStyle = g;
  x.beginPath();
  x.moveTo(p1.x, p1.y);
  x.lineTo(p2.x, p2.y);
  x.lineTo(p3.x, p3.y);
  x.closePath();
  x.fill();
};

function _in(s, p) {
  var i, j = p.length - 1;
  var odd = false;
  
  for (i = 0; i < p.length; j = i++) {
    if ((p[i].y < s.y && p[j].y >= s.y || p[j].y < s.y && p[i].y >= s.y)
        && (p[i].x <= s.x || p[j].x <= s.x)) {
      odd ^= (p[i].x + (s.y - p[i].y) * (p[j].x - p[i].x) / (p[j].y - p[i].y)) < s.x; 
    }
  } return odd;
}
</script>
<script>
    let V = new B(1);
    onresize=()=>{
  C.width=C.W=~~(innerWidth*V.r);
  C.height=C.H=~~(innerHeight*V.r);
  VT.splice(-4,4,new P(0,0),new P(0,C.H-1),new P(C.W-1,C.H-1),new P(C.W-1,0));
}
let VT=[],Q=[],R=Math.random;
for(let n=0;n<8;n++){
  let x=R()*(C.W-120)+20,y=R()*(C.H-120)+20,w=30+R()*60,h=30+R()*60,k=VT.length;
  VT.push(new P(x,y),new P(x+w,y),new P(x+w,y+h),new P(x,y+h));
  for(let m=0;m<4;m++)Q.push([k+m,k+(m+1)%4]);
}
let k=VT.length;
VT.push(new P(0,0),new P(0,C.H-1),new P(C.W-1,C.H-1),new P(C.W-1,0));
for(let m=0;m<4;m++)Q.push([k+m,k+(m+1)%4]);

let L = new P(C.W / 2, C.H / 2);

function X(a, b) {
  var d = ((a[0].x - a[1].x) * (b[0].y - b[1].y)) - ((a[0].y - a[1].y) * (b[0].x - b[1].x));

  if (Math.abs(d) < 0.001) { return new P(NaN, NaN) };

  var t = (((a[0].x - b[0].x) * (b[0].y - b[1].y)) - ((a[0].y - b[0].y) * (b[0].x - b[1].x))) / d;
  var u = (((a[0].x - b[0].x) * (a[0].y - a[1].y)) - ((a[0].y - b[0].y) * (a[0].x - a[1].x))) / d;
  
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? (new P(a[0].x + (t * (a[1].x - a[0].x)), a[0].y + (t * (a[1].y - a[0].y)))) : (new P(NaN, NaN));
}

function IN(p) { return isNaN(p.x+p.y); }

function _A(a, b) { return Math.atan2(a.y - b.y, a.x - b.x); }

function _fit(R) {
  if (R[0].x == R[1].x && R[0].y == R[1].y) return R;

  if (R[0].x == R[1].x) 
    if (R[0].y > R[1].y) {
      return [new P(R[0].x, C.H), R[1]];
    } else {
      return [new P(R[0].x, 0), R[1]];
    }
    
  if (R[0].y == R[1].y) 
    if (R[0].x > R[1].x) {
      return [new P(C.W, R[0].y), R[1]];
    } else {
      return [new P(0, R[0].y), R[1]];
    }
  
  let s = (R[1].y - R[0].y) / (R[1].x - R[0].x);
  if (R[0].y <= R[1].y) {
    return [
      new P(R[0].x + -R[0].y / s, -1),
      R[1]
    ];
  } else {
    return [
      new P(R[0].x + (C.H - R[0].y) / s, C.H + 1),
      R[1]
    ];
  }
}

function WE(w, p) {
  var a = _A(w[1], w[0]);

  return new P(
    w[0].x + p * Math.cos(a),
    w[0].y + p * Math.sin(a)
  );
}
</script>

<script>
function U() {
  var S = [];
  var i, j;
  var int, Z;

  if (!(0 >= L.x || C.W <= L.x) || (0 >= L.y || C.H <= L.y)) {
  for (i = 0; i < Q.length; i++) {
    Z = _fit([WE([VT[Q[i][0]], VT[Q[i][1]]], -1.5), L])[0];
    for (j = 0; j < Q.length; j++) {
      int = X([Z, L], [VT[Q[j][0]], VT[Q[j][1]]]);
      
      if (!IN(int)) { 
        Z = int; 
      }
    } 
    S.push(Z);

    Z = _fit([WE([VT[Q[i][0]], VT[Q[i][1]]], 1.5), L])[0];
    for (j = 0; j < Q.length; j++) {
      int = X([Z, L], [VT[Q[j][0]], VT[Q[j][1]]]);
      if (!IN(int)) { 
            Z = int; 
      }
    } 
    S.push(Z);
  }
  
  S.sort((a, b) => _A(a, L) - _A(b, L));

  S.push(S[0]);

  V.context.clearRect(0, 0, C.W, C.H);
  for (i = 1; i < S.length; i++)
    T(V, S[i], S[i - 1], L, {r:0x44,g:0xAA,b:0xFF});
  }
  requestAnimationFrame(U);
} requestAnimationFrame(U);

document.onpointermove = (e) => { L = new P(e.clientX * V.r, e.clientY * V.r); L.x = ~~L.x; L.y = ~~L.y; }
</script>
</body>
