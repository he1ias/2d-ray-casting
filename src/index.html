<script>
class Window {
  constructor(r = 0.5) {
    this.width  = ~~(window.innerWidth * r);
    this.height = ~~(window.innerHeight * r);
    this.r = r;

    this.scale = new P(1, 1);
    this.rotation = 0;
    
    this.id = new ImageData(this.width, this.height);
 
      this.C = C;
      this.context = C.getContext('2d');

      C.width  = this.width;
      C.height = this.height;
      
      this.r = r;
  } render() {}
clear() { this.context.clearRect(0, 0, this.width, this.height); }
}
class Color {
  constructor(r, g, b, a = 0xFF) {
    this.r = r;
    this.g = g;
    this.b = b;
    this.a = a;
  }
}
class P {
  constructor(x, y) {
    this.x = x;
    this.y = y;
  }
}
const f = 400;
let T =(t, p1, p2, p3, color) => {
  const x = t.context,
        g = x.createRadialGradient(light.x, light.y, 0, light.x, light.y, f);

  for (let i = 0; i <= 10; i++) {
    const u = i / 10, b = (1 - u * u) ** 2;
    g.addColorStop(u, `rgb(${color.r * b},${color.g * b},${color.b * b})`);
  }

  x.fillStyle = g;
  x.beginPath();
  x.moveTo(p1.x, p1.y);
  x.lineTo(p2.x, p2.y);
  x.lineTo(p3.x, p3.y);
  x.closePath();
  x.fill();
};

function _in(s, p) {
  var i, j = p.length - 1;
  var odd = false;
  
  for (i = 0; i < p.length; j = i++) {
    if ((p[i].y < s.y && p[j].y >= s.y || p[j].y < s.y && p[i].y >= s.y)
        && (p[i].x <= s.x || p[j].x <= s.x)) {
      odd ^= (p[i].x + (s.y - p[i].y) * (p[j].x - p[i].x) / (p[j].y - p[i].y)) < s.x; 
    }
  } return odd;
}
</script>
<script>
    let V = new Window(1);

let position = new P(0, 0);

let VT = [
  new P(300, 250),
  new P(300, 350),
  new P(400, 350),
  new P(400, 250),

  new P(0, 0),
  new P(0, V.height - 1),
  new P(V.width - 1, V.height - 1),
  new P(V.width - 1, 0)
];

let walls = [
  [0, 1],
  [1, 2],
  [2, 3],
  [3, 0],
  
  [4, 5],
  [5, 6],
  [6, 7],
  [7, 4]
];

let light = new P(V.width / 2, V.height / 2);

function intersect(a, b) {
  var d = ((a[0].x - a[1].x) * (b[0].y - b[1].y)) - ((a[0].y - a[1].y) * (b[0].x - b[1].x));

  if (Math.abs(d) < 0.001) { return new P(NaN, NaN) };

  var t = (((a[0].x - b[0].x) * (b[0].y - b[1].y)) - ((a[0].y - b[0].y) * (b[0].x - b[1].x))) / d;
  var u = (((a[0].x - b[0].x) * (a[0].y - a[1].y)) - ((a[0].y - b[0].y) * (a[0].x - a[1].x))) / d;
  
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? (new P(a[0].x + (t * (a[1].x - a[0].x)), a[0].y + (t * (a[1].y - a[0].y)))) : (new P(NaN, NaN));
}

function IN(p) { return isNaN(p.x+p.y); }

function _A(a, b) { return Math.atan2(a.y - b.y, a.x - b.x); }

function _fit(ray) {
  if (ray[0].x == ray[1].x && ray[0].y == ray[1].y) return ray;

  if (ray[0].x == ray[1].x) 
    if (ray[0].y > ray[1].y) {
      return [new P(ray[0].x, V.height), ray[1]];
    } else {
      return [new P(ray[0].x, 0), ray[1]];
    }
    
  if (ray[0].y == ray[1].y) 
    if (ray[0].x > ray[1].x) {
      return [new P(V.width, ray[0].y), ray[1]];
    } else {
      return [new P(0, ray[0].y), ray[1]];
    }
  
  let slope = (ray[1].y - ray[0].y) / (ray[1].x - ray[0].x);

  let yTop = -ray[0].y / slope;
  let yBottom = (V.height - ray[0].y) / slope;

  if (ray[0].y <= ray[1].y) {
    return [
      new P(ray[0].x + yTop, -1),
      ray[1]
    ];
  } else {
    return [
      new P(ray[0].x + yBottom, V.height + 1),
      ray[1]
    ];
  }
}

function WE(wall, am) {
  var angle = _A(wall[1], wall[0]);

  return new P(
    wall[0].x + am * Math.cos(angle),
    wall[0].y + am * Math.sin(angle)
  );
}
</script>

<script>
    let FPS = 0;
function update(tick) {
  FPS++;

  var ints = [];
  var i, j;
  var color = new Color(0xFF, 0x77, 0x66);
  var int, min;

  if ((0 >= light.x || V.width <= light.x) || (0 >= light.y || V.height <= light.y)) {
    requestAnimationFrame(update);
    return;
  }
  
  for (i = 0; i < walls.length; i++) {
    min = _fit([WE([VT[walls[i][0]], VT[walls[i][1]]], -1.5), light])[0];
    for (j = 0; j < walls.length; j++) {
      int = intersect([min, light], [VT[walls[j][0]], VT[walls[j][1]]]);
      
      if (!IN(int)) { 
        min = int; 
      }
    } 
    ints.push(min);

    min = _fit([WE([VT[walls[i][0]], VT[walls[i][1]]], 1.5), light])[0];
    for (j = 0; j < walls.length; j++) {
      int = intersect([min, light], [VT[walls[j][0]], VT[walls[j][1]]]);
      if (!IN(int)) { 
            min = int; 
      }
    } 
    ints.push(min);
  }
  
  ints.sort((a, b) => _A(a, light) - _A(b, light));

  ints.push(ints[0]);

  V.clear();
  for (i = 1; i < ints.length; i++)
    T(V, ints[i], ints[i - 1], light, color);
  
  requestAnimationFrame(update);
} requestAnimationFrame(update);

document.onpointermove = (event) => { light = new P(event.clientX * V.r, event.clientY * V.r); light.x = ~~light.x; light.y = ~~light.y; }
</script>
